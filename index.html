<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Constellation God</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #101428 0%, #05070e 100%);
      font-family: system-ui, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .hint {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      color: rgba(255, 255, 255, 0.4);
      font-size: 14px;
      letter-spacing: 1px;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="hint">DRAG ANY STAR TO MOVE IT</div>
  <canvas id="space"></canvas>

  <script>
    const canvas = document.getElementById('space');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    // Fading parameters
    const MAX_DISTANCE = 110;
    const FULL_OPACITY_DIST = 35;

    // Star coordinates mapped onto a grid to spell "CONSTELLATION GOD"
    const textGrid = [
      // --- CONSTELLATION ---
      // C
      {x: 0.5, y: 1}, {x: 0, y: 1.5}, {x: 0, y: 2.5}, {x: 0.5, y: 3},
      // O
      {x: 1.5, y: 1}, {x: 1.2, y: 2}, {x: 1.8, y: 2}, {x: 1.5, y: 3},
      // N
      {x: 2.3, y: 3}, {x: 2.3, y: 1}, {x: 2.9, y: 3}, {x: 2.9, y: 1},
      // S
      {x: 3.8, y: 1}, {x: 3.4, y: 1.8}, {x: 3.8, y: 2.2}, {x: 3.4, y: 3},
      // T
      {x: 4.2, y: 1}, {x: 4.8, y: 1}, {x: 4.5, y: 3},
      // E
      {x: 5.7, y: 1}, {x: 5.2, y: 1}, {x: 5.2, y: 2}, {x: 5.6, y: 2}, {x: 5.2, y: 3}, {x: 5.7, y: 3},
      // L
      {x: 6.1, y: 1}, {x: 6.1, y: 3}, {x: 6.6, y: 3},
      // L
      {x: 7.0, y: 1}, {x: 7.0, y: 3}, {x: 7.5, y: 3},
      // A
      {x: 8.2, y: 1}, {x: 7.9, y: 3}, {x: 8.5, y: 3}, {x: 8.0, y: 2.2}, {x: 8.4, y: 2.2},
      // T
      {x: 8.9, y: 1}, {x: 9.5, y: 1}, {x: 9.2, y: 3},
      // I
      {x: 9.9, y: 1}, {x: 9.9, y: 3},
      // O
      {x: 10.6, y: 1}, {x: 10.3, y: 2}, {x: 10.9, y: 2}, {x: 10.6, y: 3},
      // N
      {x: 11.4, y: 3}, {x: 11.4, y: 1}, {x: 12.0, y: 3}, {x: 12.0, y: 1},

      // --- GOD ---
      // G
      {x: 4.5, y: 5}, {x: 3.8, y: 5.5}, {x: 3.8, y: 6.5}, {x: 4.5, y: 7}, {x: 4.5, y: 6.1},
      // O
      {x: 6.0, y: 5}, {x: 5.4, y: 6}, {x: 6.6, y: 6}, {x: 6.0, y: 7},
      // D
      {x: 7.4, y: 5}, {x: 7.4, y: 7}, {x: 8.2, y: 6}, {x: 7.8, y: 5}, {x: 7.8, y: 7}
    ];

    let stars = [];
    let draggedStar = null;

    function buildConstellation() {
      stars = [];
      const unit = Math.min(width / 14, height / 10);
      const offsetX = (width - (12.5 * unit)) / 2;
      const offsetY = (height - (8 * unit)) / 2;

      textGrid.forEach(pt => {
        stars.push({
          x: offsetX + pt.x * unit,
          y: offsetY + pt.y * unit,
          radius: 3
        });
      });
    }

    // Interaction handling
    function getPointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function onStart(e) {
      const pos = getPointerPos(e);
      for (let star of stars) {
        const dx = star.x - pos.x;
        const dy = star.y - pos.y;
        if (Math.sqrt(dx * dx + dy * dy) < 20) {
          draggedStar = star;
          break;
        }
      }
    }

    function onMove(e) {
      if (draggedStar) {
        const pos = getPointerPos(e);
        draggedStar.x = pos.x;
        draggedStar.y = pos.y;
      }
    }

    function onEnd() {
      draggedStar = null;
    }

    window.addEventListener('mousedown', onStart);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onEnd);
    window.addEventListener('touchstart', onStart, { passive: true });
    window.addEventListener('touchmove', onMove, { passive: true });
    window.addEventListener('touchend', onEnd);

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      buildConstellation();
    });

    // Render loop
    function draw() {
      ctx.clearRect(0, 0, width, height);

      // Render connection lines with distance fading
      for (let i = 0; i < stars.length; i++) {
        for (let j = i + 1; j < stars.length; j++) {
          const dx = stars[i].x - stars[j].x;
          const dy = stars[i].y - stars[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist <= MAX_DISTANCE) {
            let alpha = 1.0;
            if (dist > FULL_OPACITY_DIST) {
              alpha = 1.0 - (dist - FULL_OPACITY_DIST) / (MAX_DISTANCE - FULL_OPACITY_DIST);
            }

            ctx.beginPath();
            ctx.moveTo(stars[i].x, stars[i].y);
            ctx.lineTo(stars[j].x, stars[j].y);
            ctx.strokeStyle = `rgba(140, 190, 255, ${alpha.toFixed(2)})`;
            ctx.lineWidth = 1.2;
            ctx.stroke();
          }
        }
      }

      // Render star nodes
      for (let star of stars) {
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#80b3ff';
        ctx.shadowBlur = 8;
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      requestAnimationFrame(draw);
    }

    buildConstellation();
    draw();
  </script>
</body>
</html>
