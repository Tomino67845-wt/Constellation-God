<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Constellation Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030208;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .panel-glass {
      background: rgba(12, 14, 28, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
    }
    input[type=range] {
      accent-color: #38bdf8;
    }
  </style>
</head>
<body class="relative w-full h-full text-slate-200">

  <canvas id="constellationCanvas"></canvas>

  <!-- Interactive Floating Control Panel -->
  <div class="absolute top-4 left-4 z-20 w-80 max-w-[calc(100vw-2rem)] panel-glass rounded-2xl p-5 transition-all duration-300">
    <div class="flex items-center justify-between mb-4 pb-2 border-b border-white/10">
      <div class="flex items-center space-x-2">
        <div class="w-3 h-3 rounded-full bg-cyan-400 shadow-[0_0_10px_#38bdf8]"></div>
        <h1 class="font-bold text-sm tracking-wider uppercase text-white">Constellation Studio</h1>
      </div>
      <span class="text-[10px] uppercase font-semibold px-2 py-0.5 rounded bg-cyan-500/20 text-cyan-300 border border-cyan-500/30">Vector Paths</span>
    </div>

    <!-- Slider 1: Dot Radius -->
    <div class="space-y-1 mb-4">
      <div class="flex justify-between text-xs text-slate-300">
        <span>Star Node Radius</span>
        <span id="radiusVal" class="font-mono text-cyan-400 font-bold">5px</span>
      </div>
      <input type="range" id="dotRadius" min="2" max="14" value="5" class="w-full h-1.5 bg-slate-700/60 rounded-lg appearance-none cursor-pointer">
    </div>

    <!-- Slider 2: Max Line Connection Distance -->
    <div class="space-y-1 mb-4">
      <div class="flex justify-between text-xs text-slate-300">
        <span>Max Fade Distance</span>
        <span id="maxDistVal" class="font-mono text-cyan-400 font-bold">120px</span>
      </div>
      <input type="range" id="maxDist" min="40" max="300" value="120" class="w-full h-1.5 bg-slate-700/60 rounded-lg appearance-none cursor-pointer">
    </div>

    <!-- Slider 3: Full Opacity Limit -->
    <div class="space-y-1 mb-4">
      <div class="flex justify-between text-xs text-slate-300">
        <span>Full Opacity Distance</span>
        <span id="fullDistVal" class="font-mono text-cyan-400 font-bold">35px</span>
      </div>
      <input type="range" id="fullDist" min="5" max="120" value="35" class="w-full h-1.5 bg-slate-700/60 rounded-lg appearance-none cursor-pointer">
    </div>

    <!-- Action Buttons -->
    <div class="pt-2 flex gap-2">
      <button id="resetBtn" class="w-full py-2 px-3 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-xs font-medium text-slate-200 transition-colors flex items-center justify-center gap-1.5 active:scale-[0.98]">
        <svg class="w-3.5 h-3.5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        Reset Nodes
      </button>
    </div>
  </div>

  <!-- Bottom Interactive Helper Hint -->
  <div class="absolute bottom-6 left-0 w-full text-center pointer-events-none z-10 px-4">
    <span class="inline-block px-4 py-2 rounded-full panel-glass text-xs font-medium text-slate-300 shadow-xl border border-white/10 tracking-wider uppercase">
      ✦ Drag any star node to bend and stretch vector line strokes ✦
    </span>
  </div>

  <script>
    const canvas = document.getElementById('constellationCanvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    // Control Elements
    const dotRadiusInput = document.getElementById('dotRadius');
    const maxDistInput = document.getElementById('maxDist');
    const fullDistInput = document.getElementById('fullDist');
    const resetBtn = document.getElementById('resetBtn');

    dotRadiusInput.addEventListener('input', (e) => {
      document.getElementById('radiusVal').innerText = e.target.value + 'px';
    });
    maxDistInput.addEventListener('input', (e) => {
      document.getElementById('maxDistVal').innerText = e.target.value + 'px';
    });
    fullDistInput.addEventListener('input', (e) => {
      document.getElementById('fullDistVal').innerText = e.target.value + 'px';
    });

    // ----------------------------------------------------
    // 1. Cosmic Background Generation (Nebula + Dim Stars)
    // ----------------------------------------------------
    let bgStars = [];
    function generateBackgroundStars() {
      bgStars = [];
      const count = Math.floor((width * height) / 2500);
      for (let i = 0; i < count; i++) {
        bgStars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 1.3 + 0.3,
          alpha: Math.random() * 0.35 + 0.05,
          twinkleSpeed: (Math.random() - 0.5) * 0.006
        });
      }
    }

    function drawCosmicBackground() {
      // Deep space radial base
      const spaceGrd = ctx.createRadialGradient(width / 2, height / 2, 80, width / 2, height / 2, Math.max(width, height) * 0.75);
      spaceGrd.addColorStop(0, '#0c0a21');
      spaceGrd.addColorStop(0.5, '#060412');
      spaceGrd.addColorStop(1, '#020106');
      ctx.fillStyle = spaceGrd;
      ctx.fillRect(0, 0, width, height);

      // Deep Purple Nebula Cloud
      const nebulaGrd1 = ctx.createRadialGradient(width * 0.35, height * 0.4, 40, width * 0.35, height * 0.4, width * 0.45);
      nebulaGrd1.addColorStop(0, 'rgba(124, 58, 237, 0.12)');
      nebulaGrd1.addColorStop(1, 'transparent');
      ctx.fillStyle = nebulaGrd1;
      ctx.fillRect(0, 0, width, height);

      // Deep Cyan/Blue Nebula Cloud
      const nebulaGrd2 = ctx.createRadialGradient(width * 0.68, height * 0.6, 50, width * 0.68, height * 0.6, width * 0.4);
      nebulaGrd2.addColorStop(0, 'rgba(14, 165, 233, 0.1)');
      nebulaGrd2.addColorStop(1, 'transparent');
      ctx.fillStyle = nebulaGrd2;
      ctx.fillRect(0, 0, width, height);

      // Render subtle twinkling background stars
      for (let i = 0; i < bgStars.length; i++) {
        const star = bgStars[i];
        star.alpha += star.twinkleSpeed;
        if (star.alpha <= 0.05 || star.alpha >= 0.4) star.twinkleSpeed *= -1;

        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(186, 230, 253, ${Math.max(0, star.alpha).toFixed(2)})`;
        ctx.fill();
      }
    }

    // ----------------------------------------------------
    // 2. Vector Letter Path Stroke Definitions
    // ----------------------------------------------------
    // Grid coordinate normalized definitions for letter strokes [x0, y0, x1, y1]
    const LETTER_STROKES = {
      'C': [[0.8, 0.15], [0.3, 0.15], [0.15, 0.5], [0.3, 0.85], [0.8, 0.85]],
      'O': [[0.5, 0.15], [0.15, 0.5], [0.5, 0.85], [0.85, 0.5], [0.5, 0.15]],
      'N': [[0.15, 0.85], [0.15, 0.15], [0.85, 0.85], [0.85, 0.15]],
      'S': [[0.8, 0.2], [0.3, 0.15], [0.2, 0.45], [0.8, 0.55], [0.7, 0.85], [0.2, 0.8]],
      'T': [[0.15, 0.15], [0.85, 0.15], [0.5, 0.15], [0.5, 0.85]],
      'E': [[0.8, 0.15], [0.15, 0.15], [0.15, 0.85], [0.8, 0.85], [0.15, 0.5], [0.65, 0.5]],
      'L': [[0.2, 0.15], [0.2, 0.85], [0.8, 0.85]],
      'A': [[0.15, 0.85], [0.5, 0.15], [0.85, 0.85], [0.3, 0.55], [0.7, 0.55]],
      'I': [[0.2, 0.15], [0.8, 0.15], [0.5, 0.15], [0.5, 0.85], [0.2, 0.85], [0.8, 0.85]],
      'G': [[0.8, 0.25], [0.35, 0.15], [0.15, 0.5], [0.35, 0.85], [0.85, 0.85], [0.85, 0.5], [0.5, 0.5]],
      'D': [[0.15, 0.15], [0.15, 0.85], [0.6, 0.85], [0.85, 0.5], [0.6, 0.15], [0.15, 0.15]]
    };

    let starNodes = [];
    let strokeConnections = [];
    let draggedNode = null;

    function buildConstellationText() {
      starNodes = [];
      strokeConnections = [];

      const wordTop = "CONSTELLATION";
      const wordBottom = "GOD";

      // Scale calculations for dynamic responsiveness
      const charWidth = Math.min(width / 15, 75);
      const charHeight = charWidth * 1.35;
      const spacing = charWidth * 0.12;

      // Density of star dots along stroke line segments
      const segmentStep = Math.max(14, charWidth * 0.28);

      function processWord(word, startY) {
        const totalWordWidth = word.length * charWidth + (word.length - 1) * spacing;
        const startX = (width - totalWordWidth) / 2;

        for (let i = 0; i < word.length; i++) {
          const char = word[i];
          const letterX = startX + i * (charWidth + spacing);
          const letterY = startY;

          const points = LETTER_STROKES[char];
          if (!points) continue;

          let prevNodeIndex = null;

          for (let p = 0; p < points.length; p++) {
            const pt = points[p];
            const targetX = letterX + pt[0] * charWidth;
            const targetY = letterY + pt[1] * charHeight;

            if (p === 0 || prevNodeIndex === null) {
              // Add origin point of stroke path
              const newIndex = addOrGetNode(targetX, targetY);
              prevNodeIndex = newIndex;
            } else {
              // Interpolate intermediate nodes along line segment
              const prevNode = starNodes[prevNodeIndex];
              const dx = targetX - prevNode.x;
              const dy = targetY - prevNode.y;
              const dist = Math.hypot(dx, dy);

              const steps = Math.max(1, Math.round(dist / segmentStep));
              let currentFromIndex = prevNodeIndex;

              for (let s = 1; s <= steps; s++) {
                const ratio = s / steps;
                const nx = prevNode.x + dx * ratio;
                const ny = prevNode.y + dy * ratio;

                const nextIndex = addOrGetNode(nx, ny);
                
                // Record explicit structural stroke connection line
                if (currentFromIndex !== nextIndex) {
                  strokeConnections.push({ from: currentFromIndex, to: nextIndex });
                }
                currentFromIndex = nextIndex;
              }
              prevNodeIndex = currentFromIndex;
            }
          }
        }
      }

      // Render top word and bottom word
      const topY = height * 0.28 - charHeight / 2;
      const bottomY = height * 0.62 - charHeight / 2;

      processWord(wordTop, topY);
      processWord(wordBottom, bottomY);
    }

    function addOrGetNode(x, y) {
      // Deduplicate close corner/intersection points
      for (let i = 0; i < starNodes.length; i++) {
        const node = starNodes[i];
        if (Math.hypot(node.x - x, node.y - y) < 4) {
          return i;
        }
      }
      starNodes.push({ x, y, origX: x, origY: y });
      return starNodes.length - 1;
    }

    // ----------------------------------------------------
    // 3. Touch & Mouse Drag Handlers
    // ----------------------------------------------------
    function getPointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function onPointerStart(e) {
      const pos = getPointerPos(e);
      const radius = parseFloat(dotRadiusInput.value);
      const grabRadius = Math.max(radius * 2.5, 22);

      let closestDist = Infinity;
      let closestNode = null;

      for (let i = 0; i < starNodes.length; i++) {
        const node = starNodes[i];
        const dist = Math.hypot(node.x - pos.x, node.y - pos.y);
        if (dist < grabRadius && dist < closestDist) {
          closestDist = dist;
          closestNode = node;
        }
      }
      draggedNode = closestNode;
    }

    function onPointerMove(e) {
      if (draggedNode) {
        const pos = getPointerPos(e);
        draggedNode.x = pos.x;
        draggedNode.y = pos.y;
      }
    }

    function onPointerEnd() {
      draggedNode = null;
    }

    window.addEventListener('mousedown', onPointerStart);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerEnd);
    window.addEventListener('touchstart', onPointerStart, { passive: true });
    window.addEventListener('touchmove', onPointerMove, { passive: true });
    window.addEventListener('touchend', onPointerEnd);

    resetBtn.addEventListener('click', () => {
      buildConstellationText();
    });

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      generateBackgroundStars();
      buildConstellationText();
    });

    // ----------------------------------------------------
    // 4. Main Animation Render Loop
    // ----------------------------------------------------
    function animate() {
      ctx.clearRect(0, 0, width, height);

      // Render cosmic nebula and background stars
      drawCosmicBackground();

      const maxDist = parseFloat(maxDistInput.value);
      const fullDist = Math.min(parseFloat(fullDistInput.value), maxDist);
      const radius = parseFloat(dotRadiusInput.value);

      // Render explicit text stroke paths with distance opacity fading
      for (let i = 0; i < strokeConnections.length; i++) {
        const conn = strokeConnections[i];
        const nodeA = starNodes[conn.from];
        const nodeB = starNodes[conn.to];

        const dx = nodeA.x - nodeB.x;
        const dy = nodeA.y - nodeB.y;
        const dist = Math.hypot(dx, dy);

        if (dist <= maxDist) {
          let alpha = 1.0;
          if (dist > fullDist) {
            alpha = 1.0 - (dist - fullDist) / (maxDist - fullDist);
          }

          ctx.beginPath();
          ctx.moveTo(nodeA.x, nodeA.y);
          ctx.lineTo(nodeB.x, nodeB.y);

          // Glowing cyan stroke line
          ctx.strokeStyle = `rgba(56, 189, 248, ${alpha.toFixed(3)})`;
          ctx.lineWidth = 2.2;
          ctx.shadowColor = 'rgba(56, 189, 248, 0.7)';
          ctx.shadowBlur = alpha > 0.5 ? 8 : 0;
          ctx.stroke();
          ctx.shadowBlur = 0;
        }
      }

      // Render star node dots
      for (let i = 0; i < starNodes.length; i++) {
        const node = starNodes[i];

        // Star Outer Halo Glow
        const glowRadius = radius * 2.8;
        const glowGradient = ctx.createRadialGradient(
          node.x, node.y, 0,
          node.x, node.y, glowRadius
        );
        glowGradient.addColorStop(0, 'rgba(56, 189, 248, 0.85)');
        glowGradient.addColorStop(0.45, 'rgba(124, 58, 237, 0.3)');
        glowGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

        ctx.beginPath();
        ctx.arc(node.x, node.y, glowRadius, 0, Math.PI * 2);
        ctx.fillStyle = glowGradient;
        ctx.fill();

        // Star Core
        ctx.beginPath();
        ctx.arc(node.x, node.y, radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
      }

      requestAnimationFrame(animate);
    }

    // Initialization
    generateBackgroundStars();
    buildConstellationText();
    animate();
  </script>
</body>
</html>
