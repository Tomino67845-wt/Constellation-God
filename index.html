<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cosmic Constellation Canvas</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      /* Cosmic Gradient Background */
      background: radial-gradient(circle at 50% 50%, #1a103c 0%, #0b0618 60%, #020108 100%);
    }

    /* Cosmic Glow Overlay Effect */
    body::before {
      content: '';
      position: absolute;
      top: -20%; left: -20%;
      width: 140%; height: 140%;
      background: 
        radial-gradient(circle at 20% 30%, rgba(138, 43, 226, 0.25) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(0, 191, 255, 0.2) 0%, transparent 45%),
        radial-gradient(circle at 50% 80%, rgba(255, 20, 147, 0.15) 0%, transparent 50%);
      pointer-events: none;
      z-index: 1;
    }

    #controls {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(15, 12, 30, 0.75);
      backdrop-filter: blur(8px);
      padding: 18px 22px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      color: #e0e6ff;
      z-index: 10;
      width: 280px;
    }

    .control-group {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .control-group label {
      font-size: 13px;
      letter-spacing: 0.5px;
      color: #a0acdb;
      display: flex;
      justify-content: space-between;
    }

    .control-group label span {
      color: #00d2ff;
      font-weight: bold;
    }

    input[type=range] {
      accent-color: #00d2ff;
      cursor: pointer;
    }

    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
    }

    .hint {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      color: rgba(160, 172, 219, 0.5);
      font-size: 13px;
      letter-spacing: 1px;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div id="controls">
    <div class="control-group">
      <label>Dot Radius: <span id="radiusVal">7</span>px</label>
      <input type="range" id="dotRadius" min="4" max="18" value="7">
    </div>
    <div class="control-group">
      <label>Max Distance: <span id="maxDistVal">120</span>px</label>
      <input type="range" id="maxDist" min="40" max="300" value="120">
    </div>
    <div class="control-group">
      <label>Full Opacity Limit: <span id="fullDistVal">40</span>px</label>
      <input type="range" id="fullDist" min="5" max="120" value="40">
    </div>
  </div>

  <div class="hint">DRAG ANY STAR TO MOVE IT FREELY</div>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    // Control Elements
    const dotRadiusInput = document.getElementById('dotRadius');
    const maxDistInput = document.getElementById('maxDist');
    const fullDistInput = document.getElementById('fullDist');

    dotRadiusInput.addEventListener('input', (e) => {
      document.getElementById('radiusVal').innerText = e.target.value;
    });
    maxDistInput.addEventListener('input', (e) => {
      document.getElementById('maxDistVal').innerText = e.target.value;
    });
    fullDistInput.addEventListener('input', (e) => {
      document.getElementById('fullDistVal').innerText = e.target.value;
    });

    // Generate accurate dot-matrix map for "CONSTELLATION GOD"
    function getSpelledCoordinates() {
      // Clean pixel map grids
      const word1 = [
        // C
        [[1,0],[0,0],[0,1],[0,2],[1,2]],
        // O
        [[0,0],[1,0],[0,2],[1,2]],
        // N
        [[0,2],[0,0],[1,2],[1,0]],
        // S
        [[1,0],[0,0],[1,1],[0,2],[1,2]],
        // T
        [[0,0],[1,0],[2,0],[1,1],[1,2]],
        // E
        [[1,0],[0,0],[0,1],[1,1],[0,2],[1,2]],
        // L
        [[0,0],[0,1],[0,2],[1,2]],
        // L
        [[0,0],[0,1],[0,2],[1,2]],
        // A
        [[0,2],[0,0],[1,0],[1,1],[0,1],[1,2]],
        // T
        [[0,0],[1,0],[2,0],[1,1],[1,2]],
        // I
        [[0,0],[0,1],[0,2]],
        // O
        [[0,0],[1,0],[0,2],[1,2]],
        // N
        [[0,2],[0,0],[1,2],[1,0]]
      ];

      const word2 = [
        // G
        [[1,0],[0,0],[0,2],[1,2],[1,1]],
        // O
        [[0,0],[1,0],[0,2],[1,2]],
        // D
        [[0,0],[1,0],[1,2],[0,2],[1,1]]
      ];

      const points = [];
      const scale = Math.min(width / 38, height / 22);
      
      // Word 1: CONSTELLATION (Top)
      let startX = (width - (34 * scale)) / 2;
      let startY = height * 0.28;

      word1.forEach((letter) => {
        letter.forEach(([px, py]) => {
          points.push({ x: startX + px * scale, y: startY + py * scale });
        });
        startX += 2.5 * scale;
      });

      // Word 2: GOD (Bottom)
      startX = (width - (8 * scale)) / 2;
      startY = height * 0.58;

      word2.forEach((letter) => {
        letter.forEach(([px, py]) => {
          points.push({ x: startX + px * scale, y: startY + py * scale });
        });
        startX += 2.8 * scale;
      });

      return points;
    }

    let stars = [];
    let draggedStar = null;

    function buildStars() {
      const coords = getSpelledCoordinates();
      stars = coords.map(pt => ({
        x: pt.x,
        y: pt.y
      }));
    }

    // Drag Interaction
    function getPointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function onStart(e) {
      const pos = getPointerPos(e);
      const radius = parseFloat(dotRadiusInput.value);
      for (let star of stars) {
        const dx = star.x - pos.x;
        const dy = star.y - pos.y;
        if (Math.sqrt(dx * dx + dy * dy) < Math.max(radius * 2, 25)) {
          draggedStar = star;
          break;
        }
      }
    }

    function onMove(e) {
      if (draggedStar) {
        const pos = getPointerPos(e);
        draggedStar.x = pos.x;
        draggedStar.y = pos.y;
      }
    }

    function onEnd() {
      draggedStar = null;
    }

    window.addEventListener('mousedown', onStart);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onEnd);
    window.addEventListener('touchstart', onStart, { passive: true });
    window.addEventListener('touchmove', onMove, { passive: true });
    window.addEventListener('touchend', onEnd);

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      buildStars();
    });

    // Render Frame
    function draw() {
      ctx.clearRect(0, 0, width, height);

      const maxDist = parseFloat(maxDistInput.value);
      const fullDist = Math.min(parseFloat(fullDistInput.value), maxDist);
      const radius = parseFloat(dotRadiusInput.value);

      // 1. Draw Fading Connection Lines
      for (let i = 0; i < stars.length; i++) {
        for (let j = i + 1; j < stars.length; j++) {
          const dx = stars[i].x - stars[j].x;
          const dy = stars[i].y - stars[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist <= maxDist) {
            let alpha = 1.0;
            if (dist > fullDist) {
              alpha = 1.0 - (dist - fullDist) / (maxDist - fullDist);
            }

            ctx.beginPath();
            ctx.moveTo(stars[i].x, stars[i].y);
            ctx.lineTo(stars[j].x, stars[j].y);
            ctx.strokeStyle = `rgba(120, 200, 255, ${alpha.toFixed(3)})`;
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }
        }
      }

      // 2. Draw Large Glowing Star Nodes
      for (let star of stars) {
        // Outer Radial Glow
        const glowGradient = ctx.createRadialGradient(
          star.x, star.y, 0,
          star.x, star.y, radius * 2.5
        );
        glowGradient.addColorStop(0, 'rgba(0, 210, 255, 0.8)');
        glowGradient.addColorStop(0.5, 'rgba(138, 43, 226, 0.3)');
        glowGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

        ctx.beginPath();
        ctx.arc(star.x, star.y, radius * 2.5, 0, Math.PI * 2);
        ctx.fillStyle = glowGradient;
        ctx.fill();

        // Inner Solid Core
        ctx.beginPath();
        ctx.arc(star.x, star.y, radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
      }

      requestAnimationFrame(draw);
    }

    buildStars();
    draw();
  </script>
</body>
</html>
