<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cosmic Constellation Canvas</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #030208;
    }

    /* Controls Panel */
    #controls {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(10, 12, 24, 0.85);
      backdrop-filter: blur(10px);
      padding: 18px 22px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      color: #e0e6ff;
      z-index: 10;
      width: 280px;
    }

    .control-group {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .control-group label {
      font-size: 13px;
      letter-spacing: 0.5px;
      color: #a0acdb;
      display: flex;
      justify-content: space-between;
    }

    .control-group label span {
      color: #00d2ff;
      font-weight: bold;
    }

    input[type=range] {
      accent-color: #00d2ff;
      cursor: pointer;
    }

    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }

    .hint {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      color: rgba(160, 172, 219, 0.5);
      font-size: 13px;
      letter-spacing: 1px;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div id="controls">
    <div class="control-group">
      <label>Dot Radius: <span id="radiusVal">8</span>px</label>
      <input type="range" id="dotRadius" min="5" max="20" value="8">
    </div>
    <div class="control-group">
      <label>Max Distance: <span id="maxDistVal">95</span>px</label>
      <input type="range" id="maxDist" min="30" max="250" value="95">
    </div>
    <div class="control-group">
      <label>Full Opacity Limit: <span id="fullDistVal">32</span>px</label>
      <input type="range" id="fullDist" min="5" max="100" value="32">
    </div>
  </div>

  <div class="hint">DRAG ANY STAR TO MOVE IT FREELY</div>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    // Control Elements
    const dotRadiusInput = document.getElementById('dotRadius');
    const maxDistInput = document.getElementById('maxDist');
    const fullDistInput = document.getElementById('fullDist');

    dotRadiusInput.addEventListener('input', (e) => {
      document.getElementById('radiusVal').innerText = e.target.value;
    });
    maxDistInput.addEventListener('input', (e) => {
      document.getElementById('maxDistVal').innerText = e.target.value;
    });
    fullDistInput.addEventListener('input', (e) => {
      document.getElementById('fullDistVal').innerText = e.target.value;
    });

    // ----------------------------------------------------
    // 1. Cosmic Background Generation (Nebula + Dim Stars)
    // ----------------------------------------------------
    let bgStars = [];
    function generateBackgroundStars() {
      bgStars = [];
      const count = Math.floor((width * height) / 2800);
      for (let i = 0; i < count; i++) {
        bgStars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 1.2 + 0.3,
          alpha: Math.random() * 0.4 + 0.1,
          twinkleSpeed: (Math.random() - 0.5) * 0.005
        });
      }
    }

    function drawCosmicBackground() {
      // Deep Space Base
      const spaceGrd = ctx.createRadialGradient(width/2, height/2, 100, width/2, height/2, width*0.85);
      spaceGrd.addColorStop(0, '#0f0a21');
      spaceGrd.addColorStop(0.5, '#070412');
      spaceGrd.addColorStop(1, '#020106');
      ctx.fillStyle = spaceGrd;
      ctx.fillRect(0, 0, width, height);

      // Nebula Cloud 1
      const nebulaGrd1 = ctx.createRadialGradient(width*0.3, height*0.35, 50, width*0.3, height*0.35, width*0.45);
      nebulaGrd1.addColorStop(0, 'rgba(138, 43, 226, 0.14)');
      nebulaGrd1.addColorStop(1, 'transparent');
      ctx.fillStyle = nebulaGrd1;
      ctx.fillRect(0, 0, width, height);

      // Nebula Cloud 2
      const nebulaGrd2 = ctx.createRadialGradient(width*0.7, height*0.65, 50, width*0.7, height*0.65, width*0.4);
      nebulaGrd2.addColorStop(0, 'rgba(0, 150, 255, 0.11)');
      nebulaGrd2.addColorStop(1, 'transparent');
      ctx.fillStyle = nebulaGrd2;
      ctx.fillRect(0, 0, width, height);

      // Dim Twinkling Stars
      for (let star of bgStars) {
        star.alpha += star.twinkleSpeed;
        if (star.alpha <= 0.05 || star.alpha >= 0.45) star.twinkleSpeed *= -1;

        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(200, 220, 255, ${star.alpha.toFixed(2)})`;
        ctx.fill();
      }
    }

    // ----------------------------------------------------
    // 2. Vector Text Path Sampling (Bigger Text + More Vertical Spacing)
    // ----------------------------------------------------
    let stars = [];
    let draggedStar = null;

    function buildPerfectTextStars() {
      stars = [];

      const offCanvas = document.createElement('canvas');
      const offCtx = offCanvas.getContext('2d');
      offCanvas.width = width;
      offCanvas.height = height;

      // Increased font size scaling
      const fontSize = Math.min(width / 11, height / 6.5);
      offCtx.font = `900 ${fontSize}px "Arial Black", "Impact", sans-serif`;
      offCtx.fillStyle = '#ffffff';
      offCtx.textAlign = 'center';
      offCtx.textBaseline = 'middle';

      // Increased vertical spacing between "CONSTELLATION" and "GOD"
      offCtx.fillText("CONSTELLATION", width / 2, height * 0.32);
      offCtx.fillText("GOD", width / 2, height * 0.65);

      const imgData = offCtx.getImageData(0, 0, width, height).data;
      
      // Step interval tuned for clean letter density
      const step = Math.max(13, Math.floor(fontSize / 5.2));

      for (let y = 0; y < height; y += step) {
        for (let x = 0; x < width; x += step) {
          const index = (y * width + x) * 4;
          if (imgData[index + 3] > 128) {
            stars.push({ x: x, y: y });
          }
        }
      }
    }

    // ----------------------------------------------------
    // 3. Drag Interaction
    // ----------------------------------------------------
    function getPointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function onStart(e) {
      const pos = getPointerPos(e);
      const radius = parseFloat(dotRadiusInput.value);
      for (let star of stars) {
        const dx = star.x - pos.x;
        const dy = star.y - pos.y;
        if (Math.sqrt(dx * dx + dy * dy) < Math.max(radius * 1.5, 20)) {
          draggedStar = star;
          break;
        }
      }
    }

    function onMove(e) {
      if (draggedStar) {
        const pos = getPointerPos(e);
        draggedStar.x = pos.x;
        draggedStar.y = pos.y;
      }
    }

    function onEnd() {
      draggedStar = null;
    }

    window.addEventListener('mousedown', onStart);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onEnd);
    window.addEventListener('touchstart', onStart, { passive: true });
    window.addEventListener('touchmove', onMove, { passive: true });
    window.addEventListener('touchend', onEnd);

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      generateBackgroundStars();
      buildPerfectTextStars();
    });

    // ----------------------------------------------------
    // 4. Main Render Loop
    // ----------------------------------------------------
    function draw() {
      ctx.clearRect(0, 0, width, height);

      // Render cosmic nebula and background stars
      drawCosmicBackground();

      const maxDist = parseFloat(maxDistInput.value);
      const fullDist = Math.min(parseFloat(fullDistInput.value), maxDist);
      const radius = parseFloat(dotRadiusInput.value);

      // Render Fading Lines
      for (let i = 0; i < stars.length; i++) {
        for (let j = i + 1; j < stars.length; j++) {
          const dx = stars[i].x - stars[j].x;
          const dy = stars[i].y - stars[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist <= maxDist) {
            let alpha = 1.0;
            if (dist > fullDist) {
              alpha = 1.0 - (dist - fullDist) / (maxDist - fullDist);
            }

            ctx.beginPath();
            ctx.moveTo(stars[i].x, stars[i].y);
            ctx.lineTo(stars[j].x, stars[j].y);
            ctx.strokeStyle = `rgba(130, 200, 255, ${alpha.toFixed(3)})`;
            ctx.lineWidth = 1.3;
            ctx.stroke();
          }
        }
      }

      // Render Star Core & Halos
      for (let star of stars) {
        // Outer Radial Glow Halo
        const glowGradient = ctx.createRadialGradient(
          star.x, star.y, 0,
          star.x, star.y, radius * 2.2
        );
        glowGradient.addColorStop(0, 'rgba(0, 210, 255, 0.85)');
        glowGradient.addColorStop(0.5, 'rgba(138, 43, 226, 0.25)');
        glowGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

        ctx.beginPath();
        ctx.arc(star.x, star.y, radius * 2.2, 0, Math.PI * 2);
        ctx.fillStyle = glowGradient;
        ctx.fill();

        // Inner Star Core
        ctx.beginPath();
        ctx.arc(star.x, star.y, radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
      }

      requestAnimationFrame(draw);
    }

    // Initialization
    generateBackgroundStars();
    buildPerfectTextStars();
    draw();
  </script>
</body>
</html>
